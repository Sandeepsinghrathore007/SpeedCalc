<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Obsidian Carbon Radial Background -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#15241c" />
      <stop offset="50%" stop-color="#0c120e" />
      <stop offset="100%" stop-color="#050706" />
    </radialGradient>

    <!-- Cyber Emerald to Mint to Solar Amber Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Solar Amber Lightning Highlight -->
    <linearGradient id="boltGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Solar Amber Lightning Shadow Facet -->
    <linearGradient id="boltGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Emerald Energy Radial Glow -->
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Tile -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108"
        fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Cyber Emerald Ambient Core Aura -->
  <circle cx="256" cy="256" r="185" fill="url(#emeraldAura)" />

  <!-- Subtle Math Matrix Grid Lines -->
  <g opacity="0.15" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,8">
    <line x1="165" y1="50" x2="165" y2="462" />
    <line x1="256" y1="36" x2="256" y2="476" />
    <line x1="347" y1="50" x2="347" y2="462" />
    <line x1="50" y1="165" x2="462" y2="165" />
    <line x1="36" y1="256" x2="476" y2="256" />
    <line x1="50" y1="347" x2="462" y2="347" />
  </g>

  <!-- Speed Calculation Concentric Rings -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#34d399" stroke-width="2" opacity="0.25" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="10 14" opacity="0.4" />

  <!-- Math Operation Accents in 4 Corners -->
  <!-- Top-Left: Plus (+) in Brand Mint -->
  <g filter="url(#badgeGlow)" opacity="0.95">
    <line x1="98" y1="120" x2="134" y2="120" stroke="#34d399" stroke-width="9" stroke-linecap="round" />
    <line x1="116" y1="102" x2="116" y2="138" stroke="#34d399" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Top-Right: Multiply (×) in Cyber Emerald -->
  <g filter="url(#badgeGlow)" opacity="0.95">
    <line x1="380" y1="104" x2="412" y2="136" stroke="#10b981" stroke-width="9" stroke-linecap="round" />
    <line x1="412" y1="104" x2="380" y2="136" stroke="#10b981" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Bottom-Left: Division (÷) in Coral Red -->
  <g filter="url(#badgeGlow)" opacity="0.95">
    <circle cx="116" cy="370" r="5" fill="#ef4444" />
    <line x1="98" y1="392" x2="134" y2="392" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
    <circle cx="116" cy="414" r="5" fill="#ef4444" />
  </g>

  <!-- Bottom-Right: Equals (=) in Solar Amber -->
  <g filter="url(#badgeGlow)" opacity="0.95">
    <line x1="380" y1="384" x2="414" y2="384" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    <line x1="380" y1="400" x2="414" y2="400" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Neon Solar Glow behind Lightning Bolt -->
  <path d="M296 52 L152 248 L262 248 L212 460 L368 262 L258 262 Z"
        fill="#f59e0b" opacity="0.5" filter="url(#boltGlow)" />

  <!-- Lightning Bolt Shadow Facet (3D Depth) -->
  <path d="M296 52 L260 262 L368 262 L212 460 L245 285 L262 248 Z"
        fill="url(#boltGradDark)" />

  <!-- Lightning Bolt Primary Body / Highlight Facet -->
  <path d="M296 52 L152 248 L262 248 L212 460 L260 262 Z"
        fill="url(#boltGradLight)" />

  <!-- Crisp Core White Highlight Stroke -->
  <path d="M296 52 L152 248 L262 248 L212 460 L368 262 L258 262 Z"
        fill="none" stroke="#fffbeb" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" />

  <!-- Speed Sparkle / Glint -->
  <polygon points="280,105 286,130 310,136 286,142 280,167 274,142 250,136 274,130"
           fill="#ffffff" opacity="0.9" />
</svg>
